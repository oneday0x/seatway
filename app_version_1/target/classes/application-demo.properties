# Demo profile: runs without PostgreSQL, using an in-memory H2 database.
# Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
# Reservations are lost when the application stops.
spring.datasource.url=jdbc:h2:mem:seatway;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
