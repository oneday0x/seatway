spring.application.name=seatway
server.port=8080

# PostgreSQL (default). Override with environment variables DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatway}
spring.datasource.username=${DB_USER:seatway}
spring.datasource.password=${DB_PASSWORD:seatway}

# Tables are created and updated from the entities; reservations are kept between restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Warsaw
