# Starts PostgreSQL for Seatway:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seatway
      POSTGRES_USER: seatway
      POSTGRES_PASSWORD: seatway
    ports:
      - "5432:5432"
    volumes:
      - seatway-data:/var/lib/postgresql/data
volumes:
  seatway-data:
