<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatway – podróże po Polsce z przystankiem po drodze</title>
    <meta name="description" content="Rezerwacja biletów kolejowych z ciekawym przystankiem po drodze, zaprojektowana dla osób starszych.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip-link" href="#app" data-i18n="skip">Przejdź do treści</a>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-left">
                <button type="button" id="back-button" class="back-button" hidden>
                    <span aria-hidden="true">←</span> <span data-i18n="back">Wróć</span>
                </button>
                <a href="#/" id="logo" class="logo">Seatway</a>
            </div>
            <p id="step" class="step" aria-live="polite"></p>
            <div class="topbar-right">
                <div id="lang-switch" class="lang-switch" role="group" aria-label="Język">
                    <button type="button" data-lang="pl" aria-pressed="true" aria-label="Polski">PL</button>
                    <button type="button" data-lang="en" aria-pressed="false" aria-label="English">EN</button>
                </div>
                <button type="button" id="text-size" class="text-size-button" aria-pressed="false">
                    <span aria-hidden="true">A+</span><span class="visually-hidden">Większy tekst</span>
                </button>
                <span class="demo-badge" data-i18n-title="demoTitle" title="Wersja demonstracyjna: bilety nie są naprawdę sprzedawane">DEMO</span>
            </div>
        </div>
    </header>

    <main id="app" tabindex="-1">
        <noscript>Seatway potrzebuje włączonej obsługi JavaScript. / Seatway needs JavaScript to be enabled.</noscript>
    </main>

    <footer class="site-footer">
        <p data-i18n="footer">Wersja demonstracyjna projektu UX. Rozkład, ceny i miejsca to przykładowe dane – bilety nie są sprzedawane.</p>
    </footer>

    <div id="dialog-root"></div>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
